name: CI Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint & Static Analysis
    uses: ./.github/workflows/quality-gates.yml

  test-and-assert:
    name: Container Build & Assertion Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Optimized Image Locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ghcr.io/lusoris/fileflows-real-image:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Run Pytest Test Suite
        env:
          TEST_IMAGE: ghcr.io/lusoris/fileflows-real-image:latest
        run: |
          pytest tests/ -v --tb=short

      - name: Analyze Image Layer Efficiency (Dive)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            wagoodman/dive:latest --ci --lowestEfficiency 0.90 ghcr.io/lusoris/fileflows-real-image:latest

  arm64-assert:
    name: arm64 Build & Architectural Assertions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build 'all' flavor for linux/arm64
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          build-args: FLAVOR=all
          platforms: linux/arm64
          tags: ghcr.io/lusoris/fileflows-real-image:arm64-ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      # Architectural invariants only: the runtime smoke test is impractical under
      # QEMU emulation, but the arm64 image is published, so it must be asserted.
      - name: Run architectural assertions against the arm64 image
        env:
          TEST_IMAGE: ghcr.io/lusoris/fileflows-real-image:arm64-ci
        run: |
          pytest tests/test_image.py::TestArchitecturalInvariants -v --tb=short

  security-scan:
    name: Zero-CVE Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test-and-assert
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Image for Vulnerability Scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ghcr.io/lusoris/fileflows-real-image:latest
          load: true
          cache-from: type=gha

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "ghcr.io/lusoris/fileflows-real-image:latest"
          format: "table"
          exit-code: "1"
          # ignore-unfixed is deliberately off. CVE-2025-6965 (bundled SQLite) carries no
          # "fixed" version in the vulnerability DB, so it was invisible both to an OS-only
          # scan and to an unfixed-suppressing one. The image is clean under this strictest
          # setting; add a scoped .trivyignore entry if an unfixable OS CVE ever appears.
          ignore-unfixed: false
          # os,library: an OS-only scan cannot see .NET dependency CVEs, so the image
          # could ship a HIGH in a NuGet package while this gate reported clean.
          vuln-type: "os,library"
          severity: "CRITICAL,HIGH"

  compose-e2e:
    name: Docker Compose E2E Smoke Test
    runs-on: ubuntu-latest
    needs: test-and-assert
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for compose
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: ghcr.io/lusoris/fileflows-real-image:latest
          load: true
          cache-from: type=gha

      - name: Validate Docker Compose Config
        run: |
          docker compose config --quiet

      - name: Start FileFlows via Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Wait for Web Service & Test HTTP Endpoint
        run: |
          for i in {1..30}; do
            if curl -s -f -L http://127.0.0.1:19200/ | grep -q "FileFlows"; then
              echo "FileFlows web UI verified successfully!"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout waiting for FileFlows web interface."
          docker compose logs
          exit 1

      - name: Clean Shutdown
        if: always()
        run: |
          docker compose down -v

  quality-gate:
    name: Quality Gate (All Checks Passed)
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-and-assert
      - arm64-assert
      - security-scan
      - compose-e2e
    steps:
      - name: Confirm all quality gates passed
        run: echo "All CI quality gates and architectural assertions passed!"
