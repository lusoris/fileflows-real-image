name: CI Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run Hadolint (Dockerfile linter)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
          failure-threshold: error
          ignore: DL3006,DL3008,DL3015

      - name: Set up Python for Linting & Tests
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run Yamllint
        run: |
          python -m pip install --upgrade pip yamllint
          yamllint -c .yamllint.yml .

      - name: Verify Documentation Consistency & Integrity
        run: |
          pip install -r tests/requirements-test.txt
          pytest tests/test_docs_consistency.py -v --tb=short

      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: "./tests"

  test-and-assert:
    name: Container Build & Assertion Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Optimized Image Locally
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: revenz/fileflows:optimized
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/requirements-test.txt

      - name: Run Pytest Test Suite
        env:
          TEST_IMAGE: revenz/fileflows:optimized
        run: |
          pytest tests/ -v --tb=short

      - name: Analyze Image Layer Efficiency (Dive)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            wagoodman/dive:latest --ci --lowestEfficiency 0.90 revenz/fileflows:optimized

  security-scan:
    name: Zero-CVE Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test-and-assert
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Image for Vulnerability Scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: revenz/fileflows:optimized
          load: true
          cache-from: type=gha

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: "revenz/fileflows:optimized"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os"
          severity: "CRITICAL,HIGH"

  compose-e2e:
    name: Docker Compose E2E Smoke Test
    runs-on: ubuntu-latest
    needs: test-and-assert
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for compose
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          tags: revenz/fileflows:optimized
          load: true
          cache-from: type=gha

      - name: Validate Docker Compose Config
        run: |
          docker compose config --quiet

      - name: Start FileFlows via Docker Compose
        run: |
          cp .env.example .env
          docker compose up -d

      - name: Wait for Web Service & Test HTTP Endpoint
        run: |
          for i in {1..30}; do
            if curl -s -f -L http://127.0.0.1:19200/ | grep -q "FileFlows"; then
              echo "FileFlows web UI verified successfully!"
              exit 0
            fi
            sleep 1
          done
          echo "Timeout waiting for FileFlows web interface."
          docker compose logs
          exit 1

      - name: Clean Shutdown
        if: always()
        run: |
          docker compose down -v

  quality-gate:
    name: Quality Gate (All Checks Passed)
    runs-on: ubuntu-latest
    needs:
      - lint
      - test-and-assert
      - security-scan
      - compose-e2e
    steps:
      - name: Confirm all quality gates passed
        run: echo "All CI quality gates and architectural assertions passed!"
