name: Build and Release Real Image

on:
  schedule:
    - cron: '0 */6 * * *' # Check upstream Docker Hub every 6 hours
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Dockerfile.optimized'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and release regardless of digest change'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # A scheduled release must clear the same gates as a pull request; without this the
  # 6-hourly path built and pushed to GHCR without running a single test.
  quality-gates:
    name: Offline Quality Gates
    uses: ./.github/workflows/quality-gates.yml

  check-and-release:
    needs: quality-gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check upstream Docker Hub image digest
        id: check-upstream
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Fetching upstream digest for revenz/fileflows:latest..."
          # `|| true` is load-bearing: steps run under `bash -e`, so a failed curl would
          # abort the step and make the buildx fallback below unreachable.
          UPSTREAM_JSON=$(curl -s -f "https://hub.docker.com/v2/repositories/revenz/fileflows/tags/latest" || true)
          UPSTREAM_DIGEST=$(echo "$UPSTREAM_JSON" | jq -r '.digest // empty')

          if [ -z "$UPSTREAM_DIGEST" ]; then
            echo "Failed to fetch upstream digest from Docker Hub API, checking via buildx..."
            UPSTREAM_DIGEST=$(docker buildx imagetools inspect --raw revenz/fileflows:latest 2>/dev/null | sha256sum | awk '{print "sha256:"$1}')
          fi

          # $UPSTREAM_DIGEST comes from a third-party API response; anything other than a
          # literal sha256 digest must not reach $GITHUB_OUTPUT, where embedded newlines
          # would let the response define arbitrary step outputs.
          if ! printf '%s' "$UPSTREAM_DIGEST" | grep -qE '^sha256:[a-f0-9]{64}$'; then
            echo "::warning::Upstream digest '$UPSTREAM_DIGEST' is not a valid sha256 digest; ignoring it."
            UPSTREAM_DIGEST=""
          fi

          echo "Upstream digest: $UPSTREAM_DIGEST"
          echo "upstream_digest=$UPSTREAM_DIGEST" >> $GITHUB_OUTPUT

          PREV_DIGEST=""
          LAST_BUILD_TIME=0

          # 1. Fetch previous digest & build timestamp from the latest GitHub Release
          if command -v gh >/dev/null 2>&1; then
            echo "Querying latest release from GitHub API..."
            LATEST_RELEASE_JSON=$(gh release view --json body,publishedAt 2>/dev/null || true)
            if [ -n "$LATEST_RELEASE_JSON" ]; then
              PREV_DIGEST=$(echo "$LATEST_RELEASE_JSON" | jq -r '.body // empty' | grep -o 'sha256:[a-f0-9]\{64\}' | head -n 1 || true)
              PUB_DATE=$(echo "$LATEST_RELEASE_JSON" | jq -r '.publishedAt // empty')
              if [ -n "$PUB_DATE" ]; then
                LAST_BUILD_TIME=$(date -d "$PUB_DATE" +%s 2>/dev/null || echo 0)
              fi
            fi
          fi

          # 2. Fallbacks if no release exists yet
          if [ -z "$PREV_DIGEST" ] && [ -f .upstream_digest ]; then
            PREV_DIGEST=$(cat .upstream_digest | tr -d '[:space:]')
          fi
          if [ "$LAST_BUILD_TIME" -eq 0 ] && [ -f .last_build_timestamp ]; then
            LAST_BUILD_TIME=$(cat .last_build_timestamp | tr -d '[:space:]')
          fi

          echo "Previous recorded digest: $PREV_DIGEST"
          CURRENT_TIME=$(date +%s)
          HOURS_SINCE_BUILD=$(( (CURRENT_TIME - LAST_BUILD_TIME) / 3600 ))
          echo "Hours since last build: $HOURS_SINCE_BUILD hrs"

          SHOULD_BUILD=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Force build requested via workflow_dispatch."
            SHOULD_BUILD=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Build triggered by push to main."
            SHOULD_BUILD=true
          elif [ "$UPSTREAM_DIGEST" != "$PREV_DIGEST" ]; then
            echo "Upstream digest changed ($UPSTREAM_DIGEST != $PREV_DIGEST). Triggering build."
            SHOULD_BUILD=true
          elif [ "$HOURS_SINCE_BUILD" -ge 24 ]; then
            echo "24 hours have elapsed ($HOURS_SINCE_BUILD hrs >= 24 hrs). Triggering daily security update & package rebuild."
            SHOULD_BUILD=true
          else
            echo "Upstream digest is unchanged and < 24h since last build. Skipping build."
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Set up QEMU (multi-architecture)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract FileFlows version & compute upstream-anchored tags
        if: steps.check-upstream.outputs.should_build == 'true'
        id: version-extractor
        run: |
          docker pull revenz/fileflows:latest
          FULL_VER=$(docker run --rm --entrypoint /bin/sh revenz/fileflows:latest \
            -c "grep -a -o '[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+' /app/Server/FileFlows.Server.dll | head -n 1")
          if [ -z "$FULL_VER" ]; then
            FULL_VER="latest"
            SHORT_VER="latest"
          else
            SHORT_VER=$(echo "$FULL_VER" | cut -d'.' -f1-3)
          fi

          # Upstream short digest (first 7 characters)
          SHORT_DIGEST=$(echo "${{ steps.check-upstream.outputs.upstream_digest }}" | sed 's/sha256://' | cut -c1-7)

          # Fetch remote tags to ensure accurate monotonic revision sequence
          git fetch --tags origin || true

          # Calculate highest repository revision for this upstream version
          HIGHEST_REV=$(git tag -l "v${SHORT_VER}-real.*" | sed -E 's/.*-real\.([0-9]+)/\1/' | sort -n | tail -n 1)
          if [ -z "$HIGHEST_REV" ]; then
            REV=1
          else
            REV=$((HIGHEST_REV + 1))
          fi

          RELEASE_TAG="v${SHORT_VER}-real.${REV}"
          IMAGE_TAG_REV="${SHORT_VER}-real.${REV}"
          IMAGE_TAG_DIGEST="${SHORT_VER}-${SHORT_DIGEST}"

          echo "Detected Full Version: $FULL_VER"
          echo "Detected Short Version: $SHORT_VER"
          echo "Short Digest: $SHORT_DIGEST"
          echo "Release Tag: $RELEASE_TAG"

          echo "full_version=$FULL_VER" >> $GITHUB_OUTPUT
          echo "short_version=$SHORT_VER" >> $GITHUB_OUTPUT
          echo "short_digest=$SHORT_DIGEST" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "image_tag_rev=$IMAGE_TAG_REV" >> $GITHUB_OUTPUT
          echo "image_tag_digest=$IMAGE_TAG_DIGEST" >> $GITHUB_OUTPUT

      - name: Build and Push Flavor 'all' (Universal Default)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: FLAVOR=all
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.short_version }}
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_rev }}
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_digest }}
          labels: |
            org.opencontainers.image.title=FileFlows Real Image (all)
            org.opencontainers.image.description=Hardened production image built from upstream revenz/fileflows
            org.opencontainers.image.version=${{ steps.version-extractor.outputs.release_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.flavor=all
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.upstream-digest=${{ steps.check-upstream.outputs.upstream_digest }}

      - name: Build and Push Flavor 'intel' (Intel Arc / Xe / QuickSync)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: FLAVOR=intel
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:intel
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.short_version }}-intel
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_rev }}-intel
          labels: |
            org.opencontainers.image.title=FileFlows Real Image (intel)
            org.opencontainers.image.description=Intel QuickSync & Arc optimized image with zero AMD/NVIDIA bloat
            org.opencontainers.image.version=${{ steps.version-extractor.outputs.release_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.flavor=intel
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.upstream-digest=${{ steps.check-upstream.outputs.upstream_digest }}

      - name: Build and Push Flavor 'amd' (AMD Radeon / Mesa VAAPI / Vulkan)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: FLAVOR=amd
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:amd
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.short_version }}-amd
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_rev }}-amd
          labels: |
            org.opencontainers.image.title=FileFlows Real Image (amd)
            org.opencontainers.image.description=AMD Radeon VAAPI & Vulkan optimized image with zero Intel/NVIDIA bloat
            org.opencontainers.image.version=${{ steps.version-extractor.outputs.release_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.flavor=amd
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.upstream-digest=${{ steps.check-upstream.outputs.upstream_digest }}

      - name: Build and Push Flavor 'cuda' (Host-Based NVIDIA NVENC/NVDEC)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: FLAVOR=cuda
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:cuda
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.short_version }}-cuda
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_rev }}-cuda
          labels: |
            org.opencontainers.image.title=FileFlows Real Image (cuda)
            org.opencontainers.image.description=Host-based NVIDIA acceleration image for NVENC/NVDEC with zero package bloat
            org.opencontainers.image.version=${{ steps.version-extractor.outputs.release_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.flavor=cuda
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.upstream-digest=${{ steps.check-upstream.outputs.upstream_digest }}

      - name: Build and Push Flavor 'cuda13' (Minimal NVIDIA CUDA 13.4 Runtime & Filters)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          build-args: FLAVOR=cuda13
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:cuda13
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.short_version }}-cuda13
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_rev }}-cuda13
          labels: |
            org.opencontainers.image.title=FileFlows Real Image (cuda13)
            org.opencontainers.image.description=Minimal cutting-edge NVIDIA CUDA 13.4 runtime image with NVRTC and NPP video filters
            org.opencontainers.image.version=${{ steps.version-extractor.outputs.release_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.flavor=cuda13
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.upstream-digest=${{ steps.check-upstream.outputs.upstream_digest }}

      - name: Create GitHub Release
        if: steps.check-upstream.outputs.should_build == 'true' && steps.version-extractor.outputs.full_version != 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.version-extractor.outputs.release_tag }}"
          VERSION_NUM=$(echo "$RELEASE_TAG" | sed 's/^v//')

          # Dynamically extract changelog section from CHANGELOG.md if present
          CHANGELOG_SECTION=""
          if [ -f CHANGELOG.md ]; then
            CHANGELOG_SECTION=$(awk -v ver="$VERSION_NUM" '
              $0 ~ "^## \\[" ver "\\]" { found=1; next }
              found && /^## \[/ { exit }
              found { print }
            ' CHANGELOG.md | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          fi

          CHANGELOG_BLOCK=""
          if [ -n "$CHANGELOG_SECTION" ]; then
            CHANGELOG_BLOCK="---

          ### What's Changed in $RELEASE_TAG

          $CHANGELOG_SECTION"
          fi

          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" \
            --title "FileFlows Real Image $RELEASE_TAG (Upstream ${{ steps.version-extractor.outputs.short_version }})" \
            --generate-notes \
            --notes "## FileFlows Real Image $RELEASE_TAG

          Hardened, multi-stage production release built from upstream \`revenz/fileflows:latest\`.

          - **Upstream Version**: \`${{ steps.version-extractor.outputs.full_version }}\` (\`${{ steps.version-extractor.outputs.short_version }}\`)
          - **Upstream Digest**: \`${{ steps.check-upstream.outputs.upstream_digest }}\` (\`${{ steps.version-extractor.outputs.short_digest }}\`)
          - **Repository Revision**: \`${{ steps.version-extractor.outputs.release_tag }}\`
          - **Base OS**: Ubuntu 26.04 (Resolute) with zero base CVEs
          - **Available Flavors**: \`all\` (default), \`intel\`, \`amd\`, \`cuda\` (Host-based CUDA), \`cuda13\` (CUDA 13.4)
          - **License**: [EUPL-1.2](https://github.com/${{ github.repository }}/blob/main/LICENSE)

          $CHANGELOG_BLOCK

          ---

          ### Pull Image Flavors
          \`\`\`bash
          # Default Universal Image
          docker pull ghcr.io/${{ github.repository }}:latest

          # Intel Arc / QuickSync Dedicated Image (Zero AMD/NVIDIA bloat)
          docker pull ghcr.io/${{ github.repository }}:intel

          # AMD Radeon VAAPI / Vulkan Dedicated Image (Zero Intel/NVIDIA bloat)
          docker pull ghcr.io/${{ github.repository }}:amd

          # NVIDIA Host-Based CUDA Dedicated Image (Zero container package bloat)
          docker pull ghcr.io/${{ github.repository }}:cuda

          # NVIDIA CUDA 13.4 Dedicated Image with Video Filters (RTX 30/40/50, Blackwell)
          docker pull ghcr.io/${{ github.repository }}:cuda13
          \`\`\`"

      - name: Auto-Update Badges, Metrics, and Version in Repository
        if: steps.check-upstream.outputs.should_build == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version-extractor.outputs.short_version }}"

          # 1. Update version.txt if valid
          if [ -n "$VERSION" ] && [ "$VERSION" != "latest" ]; then
            echo "$VERSION" > version.txt
          fi

          # 2. Inspect real image content size from Docker Buildx
          RAW_INSPECT=$(docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository }}:latest" 2>/dev/null || echo "{}")
          RAW_SIZE=0
          if echo "$RAW_INSPECT" | jq -e '.manifests' >/dev/null 2>&1; then
            AMD64_DIGEST=$(echo "$RAW_INSPECT" | jq -r '.manifests[]? | select(.platform.architecture=="amd64") | .digest' | head -n 1)
            if [ -n "$AMD64_DIGEST" ]; then
              RAW_SIZE=$(docker buildx imagetools inspect --raw "ghcr.io/${{ github.repository }}@${AMD64_DIGEST}" 2>/dev/null \
                | jq -r '[.layers[].size] | add' 2>/dev/null || echo "0")
            fi
          else
            RAW_SIZE=$(echo "$RAW_INSPECT" | jq -r '[.layers[].size] | add' 2>/dev/null || echo "0")
          fi
          # Published upstream baseline for the comparison table, in decimal MB.
          UPSTREAM_MB=999

          # A failed measurement must never be published as if it were measured:
          # fall back to leaving the existing badge and README metrics untouched.
          SIZE_MB=""
          if [ -z "$RAW_SIZE" ] || [ "$RAW_SIZE" = "null" ] || [ "$RAW_SIZE" -eq 0 ] 2>/dev/null; then
            echo "::warning::Could not measure published image size from GHCR; size badge and README metrics left unchanged."
          else
            # Decimal MB, not MiB: the published baseline below is 999 decimal MB
            # (998,895,482 bytes), so dividing by 1024 would mix unit systems and
            # silently restate the same image as ~547 "MB" with a ~45% reduction.
            SIZE_MB=$(( RAW_SIZE / 1000 / 1000 ))
            if [ "$SIZE_MB" -lt 100 ] || [ "$SIZE_MB" -gt 2000 ]; then
              echo "::warning::Measured content size ${SIZE_MB} MB is outside the plausible 100-2000 MB range; treating it as a failed measurement."
              SIZE_MB=""
            fi
          fi
          if [ -n "$SIZE_MB" ]; then
            # One decimal place, used verbatim in both the badge and the README row so
            # the same metric is never published as three different numbers.
            REDUCTION_PCT=$(awk -v b="$UPSTREAM_MB" -v s="$SIZE_MB" 'BEGIN{printf "%.1f", (b-s)*100/b}')
          fi

          # 3. Update dynamic Shields endpoint JSON files in docs/badges/
          mkdir -p docs/badges
          if [ -n "$SIZE_MB" ]; then
          cat <<EOF > docs/badges/image-size.json
          {
            "schemaVersion": 1,
            "label": "Content Size",
            "message": "${SIZE_MB} MB (-${REDUCTION_PCT}%)",
            "color": "brightgreen"
          }
          EOF
          fi

          # Guarded identically to version.txt/README: writing "latest" here would
          # permanently break test_upstream_version_badge_matches_version_txt on main.
          if [ -n "$VERSION" ] && [ "$VERSION" != "latest" ]; then
          cat <<EOF > docs/badges/upstream-version.json
          {
            "schemaVersion": 1,
            "label": "Upstream Version",
            "message": "$VERSION",
            "color": "blue"
          }
          EOF
          else
            echo "::warning::Upstream version could not be determined; version badge left unchanged."
          fi

          cat <<EOF > docs/badges/flavors.json
          {
            "schemaVersion": 1,
            "label": "Hardware Flavors",
            "message": "all | intel | amd | cuda | cuda13",
            "color": "blueviolet"
          }
          EOF

          # 4. Synchronize README.md metrics table & upstream text
          if [ -n "$VERSION" ] && [ "$VERSION" != "latest" ]; then
            sed -i -E "s/upstream version \`[0-9]+\.[0-9]+\.[0-9]+\`/upstream version \`$VERSION\`/g" README.md
          fi
          if [ -n "$SIZE_MB" ]; then
            SIZE_REGEX='\|\s*\*\*Content Size\*\*\s*\|\s*\*\*999 MB\*\*\s*\|\s*\*\*[0-9]+ MB\*\*\s*\|\s*\*\*-[0-9]+ MB \(-[0-9.]+\%\)\*\*\s*\|'
            NEW_ROW="| **Content Size** | **${UPSTREAM_MB} MB** | **${SIZE_MB} MB** | **-$(( UPSTREAM_MB - SIZE_MB )) MB (-${REDUCTION_PCT}%)** |"
            sed -i -E "s/$SIZE_REGEX/$NEW_ROW/g" README.md
          fi

          # 5. Commit and push back to main if changed
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet; then
            echo "Committing updated badges, version, and metrics..."
            git add version.txt README.md docs/badges/
            git commit -m "chore(release): auto-update badges, metrics, and version for $VERSION [skip ci]"
            git pull origin main --rebase || true
            if ! git push origin HEAD:main; then
              echo "::warning::Direct push to main was declined by GitHub branch protection."
              echo "::warning::Required status checks are expected on main. Updated files are preserved."
            else
              echo "Successfully pushed updated badges and version to main."
            fi
          else
            echo "No badge or metrics updates needed."
          fi
