name: Build and Release Real Image

on:
  schedule:
    - cron: '0 */6 * * *' # Check upstream Docker Hub every 6 hours
  push:
    branches:
      - main
    paths:
      - 'Dockerfile'
      - 'Dockerfile.optimized'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build and release regardless of digest change'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check upstream Docker Hub image digest
        id: check-upstream
        run: |
          echo "Fetching upstream digest for revenz/fileflows:latest..."
          UPSTREAM_JSON=$(curl -s -f "https://hub.docker.com/v2/repositories/revenz/fileflows/tags/latest")
          UPSTREAM_DIGEST=$(echo "$UPSTREAM_JSON" | jq -r '.digest // empty')

          if [ -z "$UPSTREAM_DIGEST" ]; then
            echo "Failed to fetch upstream digest from Docker Hub API, checking via buildx..."
            UPSTREAM_DIGEST=$(docker buildx imagetools inspect --raw revenz/fileflows:latest 2>/dev/null | sha256sum | awk '{print "sha256:"$1}')
          fi

          echo "Upstream digest: $UPSTREAM_DIGEST"
          echo "upstream_digest=$UPSTREAM_DIGEST" >> $GITHUB_OUTPUT

          PREV_DIGEST=""
          if [ -f .upstream_digest ]; then
            PREV_DIGEST=$(cat .upstream_digest | tr -d '[:space:]')
          fi
          echo "Previous recorded digest: $PREV_DIGEST"

          LAST_BUILD_TIME=0
          if [ -f .last_build_timestamp ]; then
            LAST_BUILD_TIME=$(cat .last_build_timestamp | tr -d '[:space:]')
          fi
          CURRENT_TIME=$(date +%s)
          HOURS_SINCE_BUILD=$(( (CURRENT_TIME - LAST_BUILD_TIME) / 3600 ))
          echo "Hours since last build: $HOURS_SINCE_BUILD hrs"

          SHOULD_BUILD=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force_build }}" = "true" ]; then
            echo "Force build requested via workflow_dispatch."
            SHOULD_BUILD=true
          elif [ "${{ github.event_name }}" = "push" ]; then
            echo "Build triggered by push to main."
            SHOULD_BUILD=true
          elif [ "$UPSTREAM_DIGEST" != "$PREV_DIGEST" ]; then
            echo "Upstream digest changed ($UPSTREAM_DIGEST != $PREV_DIGEST). Triggering build."
            SHOULD_BUILD=true
          elif [ "$HOURS_SINCE_BUILD" -ge 24 ]; then
            echo "24 hours have elapsed ($HOURS_SINCE_BUILD hrs >= 24 hrs). Triggering daily security update & package rebuild."
            SHOULD_BUILD=true
          else
            echo "Upstream digest is unchanged and < 24h since last build. Skipping build."
          fi

          echo "should_build=$SHOULD_BUILD" >> $GITHUB_OUTPUT

      - name: Set up QEMU (multi-architecture)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry (GHCR)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract FileFlows version & compute upstream-anchored tags
        if: steps.check-upstream.outputs.should_build == 'true'
        id: version-extractor
        run: |
          docker pull revenz/fileflows:latest
          FULL_VER=$(docker run --rm --entrypoint /bin/sh revenz/fileflows:latest \
            -c "grep -a -o '[0-9]\+\.[0-9]\+\.[0-9]\+\.[0-9]\+' /app/Server/FileFlows.Server.dll | head -n 1")
          if [ -z "$FULL_VER" ]; then
            FULL_VER="latest"
            SHORT_VER="latest"
          else
            SHORT_VER=$(echo "$FULL_VER" | cut -d'.' -f1-3)
          fi

          # Upstream short digest (first 7 characters)
          SHORT_DIGEST=$(echo "${{ steps.check-upstream.outputs.upstream_digest }}" | sed 's/sha256://' | cut -c1-7)

          # Calculate repository revision count for this upstream version
          EXISTING_COUNT=$(git tag -l "v${SHORT_VER}-real.*" | wc -l)
          REV=$((EXISTING_COUNT + 1))

          RELEASE_TAG="v${SHORT_VER}-real.${REV}"
          IMAGE_TAG_REV="${SHORT_VER}-real.${REV}"
          IMAGE_TAG_DIGEST="${SHORT_VER}-${SHORT_DIGEST}"

          echo "Detected Full Version: $FULL_VER"
          echo "Detected Short Version: $SHORT_VER"
          echo "Short Digest: $SHORT_DIGEST"
          echo "Release Tag: $RELEASE_TAG"

          echo "full_version=$FULL_VER" >> $GITHUB_OUTPUT
          echo "short_version=$SHORT_VER" >> $GITHUB_OUTPUT
          echo "short_digest=$SHORT_DIGEST" >> $GITHUB_OUTPUT
          echo "release_tag=$RELEASE_TAG" >> $GITHUB_OUTPUT
          echo "image_tag_rev=$IMAGE_TAG_REV" >> $GITHUB_OUTPUT
          echo "image_tag_digest=$IMAGE_TAG_DIGEST" >> $GITHUB_OUTPUT

      - name: Build and Push to GHCR (multi-platform)
        if: steps.check-upstream.outputs.should_build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.short_version }}
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_rev }}
            ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_digest }}
          labels: |
            org.opencontainers.image.title=FileFlows Real Image
            org.opencontainers.image.description=Hardened production image built from upstream revenz/fileflows
            org.opencontainers.image.version=${{ steps.version-extractor.outputs.release_tag }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=EUPL-1.2
            org.opencontainers.image.upstream-digest=${{ steps.check-upstream.outputs.upstream_digest }}

      - name: Update recorded upstream digest & build timestamp in git
        if: steps.check-upstream.outputs.should_build == 'true' && steps.check-upstream.outputs.upstream_digest != ''
        run: |
          echo "${{ steps.check-upstream.outputs.upstream_digest }}" > .upstream_digest
          date +%s > .last_build_timestamp
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add .upstream_digest .last_build_timestamp
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git commit -m "chore(auto): record upstream digest and build timestamp"
            git push origin main
          fi

      - name: Create GitHub Release
        if: steps.check-upstream.outputs.should_build == 'true' && steps.version-extractor.outputs.full_version != 'latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASE_TAG="${{ steps.version-extractor.outputs.release_tag }}"

          gh release create "$RELEASE_TAG" \
            --title "FileFlows Real Image $RELEASE_TAG (Upstream ${{ steps.version-extractor.outputs.short_version }})" \
            --notes "## FileFlows Real Image $RELEASE_TAG

          Hardened, multi-stage production release built from upstream \`revenz/fileflows:latest\`.

          - **Upstream Version**: \`${{ steps.version-extractor.outputs.full_version }}\` (\`${{ steps.version-extractor.outputs.short_version }}\`)
          - **Upstream Digest**: \`${{ steps.check-upstream.outputs.upstream_digest }}\` (\`${{ steps.version-extractor.outputs.short_digest }}\`)
          - **Repository Revision**: \`${{ steps.version-extractor.outputs.release_tag }}\`
          - **Base OS**: Ubuntu 26.04 (Resolute) with zero base CVEs
          - **Layer Efficiency**: 100% (zero wasted layer overhead via rootfs squashing)
          - **Supported Platforms**: \`linux/amd64\`, \`linux/arm64\`
          - **License**: [EUPL-1.2](https://github.com/${{ github.repository }}/blob/main/LICENSE)

          ### Pull Image
          \`\`\`bash
          docker pull ghcr.io/${{ github.repository }}:latest
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.short_version }}
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_rev }}
          docker pull ghcr.io/${{ github.repository }}:${{ steps.version-extractor.outputs.image_tag_digest }}
          \`\`\`"
