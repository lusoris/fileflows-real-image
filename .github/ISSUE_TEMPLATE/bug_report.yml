name: Bug report
description: Create a report to help us fix packaging, container, or driver issues
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing an issue! If you're experiencing an upstream application bug
        (not container or driver related), please file it in the
        [upstream repository](https://github.com/revenz/FileFlows/issues).
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what happened.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: How to reproduce
      description: Steps or `docker run` / `docker-compose.yml` configuration to reproduce the behavior.
      placeholder: |
        1. Run container with `docker run ...`
        2. Inspect logs with `docker logs ...`
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs and command output
      description: Please copy and paste any relevant container logs.
      render: shell
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Host OS, Docker version, GPU hardware (Intel/NVIDIA/AMD) if applicable.
      placeholder: |
        - Host OS: Ubuntu 24.04 / Debian / Windows / Unraid
        - Docker Version: 26.x
        - GPU: Intel i9-12900K / NVIDIA RTX / None
    validations:
      required: true
