# Pre-commit configuration for FileFlows Real Image
# Run on demand: pre-commit run --all-files

minimum_pre_commit_version: "3.5.0"
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-yaml
        exclude: '^mkdocs\.yml$'
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  - repo: https://github.com/hadolint/hadolint
    rev: v2.14.0
    hooks:
      # hadolint-docker, not hadolint: the plain hook is language "system" and needs the
      # binary on PATH, which CI runners do not have ("Executable `hadolint` not found").
      - id: hadolint-docker
        args: ["--config", ".hadolint.yaml"]

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        args: ["-c", ".yamllint.yml"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.1
    hooks:
      - id: codespell
        additional_dependencies: [tomli]

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.45.0
    hooks:
      - id: markdownlint
        args: ["--config", ".markdownlint.json"]
        # Excluded: generated site output, GitHub form templates (intentionally start at
        # h2) and agent definition files (frontmatter + prose, not documents).
        exclude: '^(build-docs/|\.github/(copilot-instructions\.md|PULL_REQUEST_TEMPLATE\.md|ISSUE_TEMPLATE/)|\.claude/)'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
